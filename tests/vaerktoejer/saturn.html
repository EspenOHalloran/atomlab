<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planeter (værktøj)</title>
  <!-- Udviklingsværktøj: prototypen med Saturn og månerne alene (bruges af saturn.mjs), eller Mars med ?f=mars (mars.mjs). Ikke en del af AtomLab. -->
  <style>
    html, body { margin: 0; height: 100%; background: #03040c; overflow: hidden; }
    canvas { display: block; }
    #info { position: fixed; left: 8px; top: 8px; color: #cfe0ff; font: 13px system-ui, sans-serif; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../../lib/three/three.module.js", "three/addons/": "../../lib/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="laerred"></canvas>
  <div id="info">Træk for at dreje, rul for at zoome.</div>
  <script type="module">
    import * as THREE from 'three';
    import { lavVerden, verden, visTåger } from '../../js/scene3d.js';

    lavVerden(document.getElementById('laerred'));
    visTåger(false); // som i Kosmos: sort himmel med stjerner
    const { scene, kamera, styring } = verden;
    styring.autoRotate = false;
    const gruppe = new THREE.Group();
    scene.add(gruppe);
    const ctx = {
      verden,
      opdaterKnapper() {},
      forklaring() {},
      fase(titel) { document.getElementById('info').textContent = titel ?? ''; },
      kamera({ retning, radius }) {
        styring.target.set(0, 0, 0);
        kamera.position.copy(new THREE.Vector3(...retning).normalize().multiplyScalar(radius * 2.6));
        styring.update();
      },
    };
    const navn = new URLSearchParams(location.search).get('f') ?? 'saturn';
    const fænomen = (await import(`../../js/kosmos/${navn}.js`)).default;
    const k = fænomen.lav(gruppe, ctx);
    let tid = 0;
    let frosset = false;
    verden.opdateringer.add((dt) => { if (!frosset) tid += dt; k.opdater(dt, tid); });
    // Vælg en visning ('Saturn', 'Enceladus' eller 'Titan') eller slå "Modlys" til
    // Som i Kosmos: en knap kalder handling, og en til/fra-knap skifter til og kalder skift
    const tryk = (tekst) => { const s = k.styring.find((x) => x.tekst.startsWith(tekst)); if (s.handling) s.handling(); else { s.til = !s.til; s.skift(s.til); } };
    // Kameraet kigger fra en retning og en afstand (i scene-enheder)
    const kig = (retning, afstand) => {
      kamera.position.copy(new THREE.Vector3(...retning).normalize().multiplyScalar(afstand));
      styring.target.set(0, 0, 0);
      styring.update();
    };
    // Flybyen: start den, gå et stop frem, og gør flyvningen færdig med det samme
    const flyby = { start: () => tryk('▶ Start flyby'), næste: () => tryk('Næste'), hop: () => k.test.hop(), tur: () => k.test.tur() };
    window.saturnTest = { tryk, kig, flyby, frys: (t) => { tid = t; frosset = true; }, test: k.test };
  </script>
</body>
</html>
